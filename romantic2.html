<script>
const text = `I really want to hear you call me the most beautiful girl in the world again 😌. I love your cooking, your smell, your neatness, and your goofiness. Every little thing about you makes me smile. Stay here with me, let's enjoy this moment together… 🍷✨`;

let i=0;
function typeWriter(){
 if(i<text.length){
  document.getElementById("typed").innerHTML += text.charAt(i);
  i++;
  setTimeout(typeWriter,40);
 }
}
typeWriter();
